name: Release validation

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.package.outputs.artifact-name }}
      version:
        value: ${{ jobs.package.outputs.version }}
      dist-tag:
        value: ${{ jobs.package.outputs.dist-tag }}
      sha:
        value: ${{ jobs.package.outputs.sha }}
      integrity:
        value: ${{ jobs.package.outputs.integrity }}

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-name: codex-reset-scheduler-package-${{ github.run_attempt }}
      version: ${{ steps.metadata.outputs.version }}
      dist-tag: ${{ steps.metadata.outputs.dist-tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      integrity: ${{ steps.package.outputs.integrity }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify version, release tag and exact main CI
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-version.mjs workflow
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack once and smoke the installed artifact
        id: package
        shell: bash
        run: |
          mkdir release-artifact
          pnpm pack --out release-artifact/package.tgz
          node scripts/package-smoke.mjs release-artifact/package.tgz
          echo "integrity=$(node scripts/release-registry.mjs integrity release-artifact/package.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-reset-scheduler-package-${{ github.run_attempt }}
          path: release-artifact/package.tgz
          if-no-files-found: error
