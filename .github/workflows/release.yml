name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: mkdir release-artifact
      - run: pnpm pack --pack-destination release-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: codex-resetrail-package
          path: release-artifact/*.tgz
          if-no-files-found: error

# Publishing is intentionally absent. pnpm publish requires a separate approval.
