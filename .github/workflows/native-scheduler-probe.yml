name: Native scheduler capability probe

on:
  workflow_dispatch:
  # Temporary: remove after three successful native runs, before merge.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/native-scheduler-probe.mjs
      - .github/workflows/native-scheduler-probe.yml

permissions:
  contents: read

concurrency:
  group: native-scheduler-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-marker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'test/native-scheduler-capability-20261007')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Observe natural user-scheduler marker execution
        run:
          node scripts/native-scheduler-probe.mjs --report
          native-scheduler-report.json
      - name: Recover owned probe artifacts
        if: always()
        run:
          node scripts/native-scheduler-probe.mjs --cleanup
          native-scheduler-report.json
      - name: Upload execution and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scheduler-${{ matrix.os }}
          path: native-scheduler-report.json
          if-no-files-found: error
