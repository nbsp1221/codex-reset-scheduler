name: Native scheduler capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-scheduler-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-marker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Observe natural user-scheduler marker execution
        run:
          node scripts/native-scheduler-probe.mjs --report
          native-scheduler-report.json
      - name: Recover owned probe artifacts
        if: always()
        run:
          node scripts/native-scheduler-probe.mjs --cleanup
          native-scheduler-report.json
      - name: Upload execution and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scheduler-${{ matrix.os }}
          path: native-scheduler-report.json
          if-no-files-found: error
